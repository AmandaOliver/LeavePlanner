name: Secret scan

# Secrets leaked into this repository once. This job is the backstop that stops it
# happening again: it fails the build on any credential-shaped string, in the diff
# and in the history. Pair it with GitHub's push protection (Settings > Code security),
# which blocks the push outright and is free on public repositories.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Catch newly published detection rules against existing history.
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers past commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
