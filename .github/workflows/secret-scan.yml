name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, so new detection rules are applied to existing history.
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
